name: Game CI

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade --constraint constraints.txt pip
          python -m pip install --constraint constraints.txt --build-constraint constraints.txt ".[dev,tools]"

      - name: Check formatting
        run: python -m black --check src tests tools game_pygame.py

      - name: Check import order
        run: python -m isort --check-only src tests tools game_pygame.py

      - name: Run Ruff correctness checks
        run: python -m ruff check src

      - name: Enforce asset size budget
        run: python tools/check_asset_budget.py

      - name: Validate ability taxonomy migration
        run: python tools/validate_ability_taxonomy.py --require-complete

      - name: Verify deterministic contact fit
        run: python tools/fit_contact_model.py --check

      - name: Run strict typing baseline
        run: |
          python -m mypy --strict --follow-imports=skip \
            src/paths.py \
            tools/build_distribution.py \
            src/core/combat/encounter.py \
            src/core/combat/targeting.py \
            src/core/combat/battle_engine/models.py \
            src/core/identity.py \
            src/core/randomness.py \
            src/core/contracts \
            src/core/data/ability_schema.py \
            src/core/data/ability_traits.py \
            src/core/progression/models.py \
            src/core/save_system/manager.py \
            src/ui_pygame/screen_runtime.py \
            src/core/combat/contact.py \
            tools/fit_contact_model.py \
            tools/characterize_foundational_contract.py

      - name: Run tests with source coverage
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPYCACHEPREFIX: /tmp/pycache
        run: |
          python -m pytest tests/ -q \
            --cov=src \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Check for syntax errors
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPYCACHEPREFIX: /tmp/pycache
        run: python -m compileall src

  artifact-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    needs: validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade --constraint constraints.txt pip
          python -m pip install --constraint constraints.txt --build-constraint constraints.txt ".[dev]"

      - name: Build onedir application
        run: python tools/build_distribution.py --clean

      - name: Smoke-test frozen application outside checkout
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          FORSAKEN_TENET_DATA_DIR: ${{ runner.temp }}/forsaken-tenet-smoke-data
        working-directory: ${{ runner.temp }}
        run: ${{ github.workspace }}/dist/forsaken-tenet/forsaken-tenet --smoke-test

      - name: Upload intentional application artifact
        uses: actions/upload-artifact@v4
        with:
          name: forsaken-tenet-linux-onedir
          path: dist/forsaken-tenet/
          if-no-files-found: error
