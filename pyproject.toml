[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "the-forsaken-tenet"
version = "2.0.0"
description = "A visual dungeon-crawl RPG built with Pygame"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "stb5585"}
]
keywords = ["game", "rpg", "dungeon-crawler", "roguelike", "pygame"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=2.2.0",
    "pyyaml>=6.0.2",
    "pygame>=2.5.0",  # For GUI and asset/sprite rendering
    "Pillow>=10.0.0",  # For perspective transforms and image processing
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.10.0",
    "pytest>=7.4.2",
    "pytest-cov>=4.1.0",
    "pyinstaller>=6.0.0",
    "ruff>=0.6.0",
]
tools = [
    "scipy==1.17.0",
]

[project.urls]
Homepage = "https://github.com/stb5585/Dungeon-Crawl"
Repository = "https://github.com/stb5585/Dungeon-Crawl"
Issues = "https://github.com/stb5585/Dungeon-Crawl/issues"

[project.scripts]
forsaken-tenet = "src.ui_pygame.game:main"
forsaken-tenet-pygame = "src.ui_pygame.game:main"
# Backward-compatible alias for existing local/dev workflows.
dungeon-crawl-pygame = "src.ui_pygame.game:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.core.data" = [
    "abilities/*.yaml",
    "abilities/*.txt",
    "content/*.json",
    "maps/*.json",
    "maps/*.txt",
    "maps/*.tsx",
    "maps/tileset/*.png",
]
"src.ui_pygame.assets" = ["**/*.json", "**/*.png", "**/*.wav", "**/*.ogg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = [
    "--verbose",
    "--strict-markers",
    "--tb=short",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    ".venv/*",
    "setup.py",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B004", "B023", "B039"]

[tool.ruff.lint.per-file-ignores]
# Package initializers intentionally expose compatibility and public APIs.
"**/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
